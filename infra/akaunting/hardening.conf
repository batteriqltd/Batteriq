ServerTokens Prod
ServerSignature Off
ServerName localhost

# Never serve project metadata or tooling files.
<FilesMatch "(?i)^(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|webpack\.mix\.js|artisan|.*\.md|\.env.*)$">
    Require all denied
</FilesMatch>

Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
